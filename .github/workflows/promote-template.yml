name: Promote CloudFormation template

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to publish, for example v1.1.0
        required: true
      bucket:
        description: Public onboarding artifact S3 bucket
        required: true
      aws_region:
        description: Region containing the artifact bucket
        required: true
        default: us-east-1

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Validate template
        run: |
          pip install --disable-pip-version-check cfn-lint
          cfn-lint intelog-cloud-runner-role.yaml
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.ONBOARDING_PUBLISH_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - name: Publish immutable template
        env:
          BUCKET: ${{ inputs.bucket }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          key="aws-onboarding/${RELEASE_TAG}/intelog-cloud-runner-role.yaml"
          aws s3 cp intelog-cloud-runner-role.yaml "s3://${BUCKET}/${key}" \
            --content-type application/yaml \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3api head-object --bucket "$BUCKET" --key "$key"
          echo "Template URL: https://${BUCKET}.s3.${{ inputs.aws_region }}.amazonaws.com/${key}" >> "$GITHUB_STEP_SUMMARY"
