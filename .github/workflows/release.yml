name: Publish onboarding package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate package
        run: |
          bash -n onboard.sh
          shellcheck onboard.sh
          pip install --disable-pip-version-check cfn-lint
          cfn-lint intelog-cloud-runner-role.yaml
      - name: Build immutable customer archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="aws-cloud-runner-onboarding-package-${RELEASE_TAG}"
          mkdir "$package"
          cp README.md SECURITY.md onboard.sh onboarding.env.example intelog-cloud-runner-role.yaml "$package/"
          tar -czf "${package}.tar.gz" "$package"
          zip -qr "${package}.zip" "$package"
          sha256sum "${package}.tar.gz" "${package}.zip" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ./*.tar.gz ./*.zip SHA256SUMS --generate-notes --verify-tag
